# SingleBinary deployment mode - SimpleScalable/Distributed (the chart's default) require
# external object storage (S3/GCS/etc); SingleBinary just needs a PVC, which is all a
# homelab-scale log volume needs (matches this project's low-redundancy Longhorn choice
# elsewhere - see configs/longhorn).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  ingester:
    chunk_encoding: snappy
  # Without this, nothing ever deletes old chunks/index and the PVC fills up silently until
  # Loki can't even start (hit this: "no space left on device" on a 10Gi volume after ~2 days
  # of Promtail shipping the whole cluster's logs). SingleBinary mode runs the compactor
  # in-process (compactor.replicas above is for the separate Distributed-mode deployment,
  # doesn't apply here) - just needs retention turned on.
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    # Started at 10Gi, filled up in ~2 days (see limits_config/compactor below for the real
    # fix - retention was never configured). Bumped to 20Gi as headroom; the live PVC was
    # already expanded to match by hand (StatefulSet volumeClaimTemplates are immutable, so
    # this value only takes effect for a fresh install, not an existing PVC).
    size: 20Gi

# SimpleScalable-mode targets - must be zeroed out explicitly, the chart won't infer this
# from deploymentMode alone.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# No object storage backend (minio) needed for filesystem storage.
minio:
  enabled: false

# Not needed for a single-tenant homelab setup. chunksCache in particular defaults to
# allocating 8Gi for its memcached instance - way beyond what this cluster's log volume needs.
test:
  enabled: false
lokiCanary:
  enabled: false
gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
