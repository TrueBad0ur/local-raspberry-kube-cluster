# Keycloak.X (codecentric/keycloakx chart), using the official quay.io/keycloak/keycloak image.
# The Bitnami chart/image previously used here is no longer free (Bitnami Secure Images, Aug 2025).
#
# Admin bootstrap credentials are NOT stored here (public repo) - they come from the
# "keycloak-admin-credentials" Secret created once via install.sh before the helm install.

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.6.4"

# The image's entrypoint takes no default action; give it a subcommand.
args:
  - start

# dev-file (H2, file-backed) instead of dev-mem so data survives pod restarts, backed by a
# Longhorn PVC below. Fine for a homelab SSO with a handful of users; swap for a real
# Postgres (e.g. CNPG) later if stronger durability/HA is needed.
database:
  vendor: dev-file

volumeClaimTemplates: |
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "longhorn"
      resources:
        requests:
          storage: 1Gi

extraVolumeMounts: |
  - name: data
    mountPath: /opt/keycloak/data

# TLS terminates at NPM; kgateway/Keycloak stay on plain HTTP internally.
proxy:
  enabled: true
  mode: forwarded

extraEnv: |
  - name: KC_HOSTNAME
    value: "https://keycloak.kube.truebad0ur.space"

extraEnvFrom: |
  - secretRef:
      name: keycloak-admin-credentials

http:
  relativePath: "/"

# Gateway API (kgateway) route instead of Ingress.
httpRoute:
  enabled: true
  annotations:
    link.argocd.argoproj.io/external-link: https://keycloak.kube.truebad0ur.space
  parentRefs:
    - name: http
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - "keycloak.kube.truebad0ur.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
