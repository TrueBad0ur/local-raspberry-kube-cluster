# Prerequisite (one-time, not managed here, secret kept out of git):
#   kubectl create secret generic grafana-oidc-secret -n monitoring \
#     --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET="<grafana client secret from Keycloak>"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argo-cd
spec:
  project: default
  # The chart mints monitoring-grafana's admin-password from grafana.adminPassword in values.yml,
  # but that only seeds Grafana's DB on first-ever boot - the user changes the real admin password
  # by hand through the UI afterwards (never stored in git, public repo). Without this, Argo CD's
  # selfHeal kept reverting our out-of-band `kubectl patch secret ... admin-password` back to the
  # stale values.yml value on every reconcile, which is what made the dashboard sidecar's
  # live-reload call to Grafana's API 401 (REQ_PASSWORD read from a Secret that no longer matched
  # the real password) - forcing a manual pod restart after every dashboard/datasource change.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: monitoring-grafana
      jsonPointers:
        - /data/admin-password
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.0
      helm:
        valueFiles:
          - $values/configs/monitoring/kube-prometheus-stack/values.yml
    - repoURL: https://github.com/TrueBad0ur/local-raspberry-kube-cluster.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/TrueBad0ur/local-raspberry-kube-cluster.git
      targetRevision: main
      path: configs/monitoring/kube-prometheus-stack
      directory:
        include: "grafana-httproute.yml"
    - repoURL: https://github.com/TrueBad0ur/local-raspberry-kube-cluster.git
      targetRevision: main
      path: configs/monitoring/kube-prometheus-stack
      directory:
        include: "cluster-dashboard-configmap.yml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs (Prometheus, Alertmanager, etc.) are large enough that
      # applying them via a patch (client- or server-side) tries to write/merge against the
      # full existing object and exceeds the 256KiB annotation limit ("metadata.annotations:
      # Too long"). ServerSideApply alone didn't avoid this - Replace does a full PUT instead
      # of a patch, which sidesteps the annotation-size check entirely. This is the combo
      # Argo CD's own docs recommend for oversized CRDs.
      - ServerSideApply=true
      - Replace=true
