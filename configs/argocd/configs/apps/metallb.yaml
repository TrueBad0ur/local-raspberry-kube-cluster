apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argo-cd
spec:
  project: default
  # The bgppeers CRD's conversion webhook caBundle is generated and patched in at runtime by
  # metallb's own controller (self-signed webhook cert), not something the chart's static
  # manifest can know — Argo CD resetting it to the chart's placeholder on every sync, only
  # for the controller to patch it right back, caused a perpetual OutOfSync/Synced flap.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.9
    - repoURL: https://github.com/TrueBad0ur/local-raspberry-kube-cluster.git
      targetRevision: main
      path: configs/metallb
      directory:
        include: "metallb.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
