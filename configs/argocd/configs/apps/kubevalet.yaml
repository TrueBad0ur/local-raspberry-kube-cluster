# ⚠ Chart default admin/admin login (auth.adminUsername/adminPassword) is NOT overridden here.
# Log in once after first sync and change the password immediately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevalet
  namespace: argo-cd
  annotations:
    # Argo CD Image Updater: track the `latest` tag's digest on Docker Hub and patch this
    # Application's Helm parameters (image.repository/image.tag) when it changes, redeploying
    # kubevalet automatically without a git commit.
    argocd-image-updater.argoproj.io/image-list: kubevalet=truebad0ur/kubevalet
    argocd-image-updater.argoproj.io/kubevalet.update-strategy: digest
    argocd-image-updater.argoproj.io/kubevalet.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/kubevalet.helm.image-tag: image.tag
spec:
  project: default
  source:
    repoURL: https://github.com/TrueBad0ur/kubevalet.git
    targetRevision: main
    path: charts/kubevalet
    helm:
      values: |
        image:
          tag: "latest"
        ingress:
          enabled: false
        httpRoute:
          enabled: true
          hostname: "kubevalet.kube.truebad0ur.space"
          annotations:
            link.argocd.argoproj.io/external-link: https://kubevalet.kube.truebad0ur.space
          parentRefs:
            name: http
            namespace: kgateway-system
        postgres:
          persistence:
            enabled: true
            storageClassName: longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: kubevalet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
