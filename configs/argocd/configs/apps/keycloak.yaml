# Prerequisite (one-time, not managed here, secret kept out of git - only used on first
# boot of an empty DB, ignored afterwards):
#   kubectl create secret generic keycloak-admin-credentials -n keycloak \
#     --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME=admin \
#     --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 18 | tr -d '=+/' | cut -c1-20)"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argo-cd
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.2.3
      helm:
        valueFiles:
          - $values/configs/keycloak/values.yml
    - repoURL: https://github.com/TrueBad0ur/local-raspberry-kube-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
