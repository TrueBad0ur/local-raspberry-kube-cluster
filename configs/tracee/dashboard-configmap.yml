# Auto-discovered by Grafana's dashboard sidecar (grafana_dashboard=1 label, same mechanism as
# configs/monitoring/kube-prometheus-stack/cluster-dashboard-configmap.yml).
#
# Prometheus only gives aggregate counters (see servicemonitor.yml comment - no per-event-type
# breakdown), so the actual "which process ran / which connection was made" visibility comes
# from Loki, fed by Promtail tailing Tracee's JSON pod logs.
#
# Node vs Container: tracee's own JSON field `hostName` is the CONTAINER's hostname (Tracee
# traces every process on the node via hostPID, so this can be "coredns-xxx", "promtail-xxx",
# etc - not the physical node). The real k8s node is the `node_name` Loki label Promtail attaches
# based on which node the tracee pod itself runs on (via hostPID it sees everything on that node
# regardless of which pod/container the traced process belongs to) - confirmed live via
# /loki/api/v1/labels and cross-checked against a real query response's frame shape.
#
# Loki log-selector queries return one JSON object per row inside a single `labels` field (not
# separate columns) - confirmed via a real /api/ds/query response, not assumed. The `extractFields`
# transform (source: labels, format: json) is what turns that into actual table columns; the
# `organize` transform after it then hides noise and sets display names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tracee
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  tracee.json: |
    {
      "title": "Tracee - Runtime Security",
      "uid": "tracee-runtime-security",
      "timezone": "utc+3",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values(node_name)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] }
          },
          {
            "name": "event",
            "type": "custom",
            "query": "sched_process_exec,sched_process_exit,net_tcp_connect,net_packet_icmp,net_packet_http_request,net_packet_http_response",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview (Prometheus)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Event rate",
          "id": 1,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum by (pod) (rate(tracee_ebpf_events_total[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Filtered / lost / errors",
          "id": 2,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum(rate(tracee_ebpf_events_filtered[5m]))",
              "legendFormat": "filtered",
              "refId": "A"
            },
            {
              "expr": "sum(rate(tracee_ebpf_lostevents_total[5m]))",
              "legendFormat": "lost",
              "refId": "B"
            },
            {
              "expr": "sum(rate(tracee_ebpf_errors_total[5m]))",
              "legendFormat": "errors",
              "refId": "C"
            }
          ]
        },
        {
          "type": "row",
          "title": "At a glance (Loki) - filter by node/event above",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Events by node",
          "id": 5,
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["sum"] }
          },
          "targets": [
            {
              "expr": "sum by (node_name) (count_over_time({namespace=\"tracee\", node_name=~\"$node\"} | json event=\"eventName\" | event=~\"$event\" [$__interval]))",
              "legendFormat": "{{node_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "bargauge",
          "title": "Events by type",
          "id": 6,
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["sum"] }
          },
          "targets": [
            {
              "expr": "sum by (event) (count_over_time({namespace=\"tracee\", node_name=~\"$node\"} | json event=\"eventName\" | event=~\"$event\" [$__interval]))",
              "legendFormat": "{{event}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Process executions",
          "id": 3,
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showHeader": true,
            "sortBy": [{ "displayName": "Time", "desc": true }]
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "width": 140 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Time" }, "properties": [{ "id": "custom.width", "value": 180 }] },
              { "matcher": { "id": "byName", "options": "PID" }, "properties": [{ "id": "custom.width", "value": 90 }] },
              { "matcher": { "id": "byName", "options": "PPID" }, "properties": [{ "id": "custom.width", "value": 90 }] },
              { "matcher": { "id": "byName", "options": "Ret" }, "properties": [{ "id": "custom.width", "value": 70 }] },
              {
                "matcher": { "id": "byName", "options": "Args" },
                "properties": [{ "id": "custom.cellOptions", "value": { "type": "json-view" } }]
              }
            ]
          },
          "transformations": [
            {
              "id": "extractFields",
              "options": { "source": "labels", "format": "json", "replace": false }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Line": true,
                  "tsNs": true,
                  "id": true,
                  "labels": true,
                  "labelTypes": true,
                  "namespace": true,
                  "pod": true,
                  "container": true,
                  "job": true,
                  "instance": true,
                  "service_name": true,
                  "stream": true,
                  "filename": true,
                  "app": true,
                  "component": true,
                  "detected_level": true
                },
                "indexByName": {
                  "Time": 0,
                  "node_name": 1,
                  "process": 2,
                  "event": 3,
                  "pid": 4,
                  "ppid": 5,
                  "ret": 6,
                  "args": 7
                },
                "renameByName": {
                  "node_name": "Node",
                  "process": "Process",
                  "event": "Event",
                  "pid": "PID",
                  "ppid": "PPID",
                  "ret": "Ret",
                  "args": "Args"
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "{namespace=\"tracee\", node_name=~\"$node\"} | json event=\"eventName\", process=\"processName\", pid=\"processId\", ppid=\"parentProcessId\", ret=\"returnValue\", args=\"args\" | event=~\"sched_process_exec|sched_process_exit\" | event=~\"$event\"",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Network activity (connect / icmp / http)",
          "id": 4,
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showHeader": true,
            "sortBy": [{ "displayName": "Time", "desc": true }]
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "width": 140 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Time" }, "properties": [{ "id": "custom.width", "value": 180 }] },
              { "matcher": { "id": "byName", "options": "PID" }, "properties": [{ "id": "custom.width", "value": 90 }] },
              { "matcher": { "id": "byName", "options": "PPID" }, "properties": [{ "id": "custom.width", "value": 90 }] },
              { "matcher": { "id": "byName", "options": "Ret" }, "properties": [{ "id": "custom.width", "value": 70 }] },
              {
                "matcher": { "id": "byName", "options": "Args" },
                "properties": [{ "id": "custom.cellOptions", "value": { "type": "json-view" } }]
              }
            ]
          },
          "transformations": [
            {
              "id": "extractFields",
              "options": { "source": "labels", "format": "json", "replace": false }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Line": true,
                  "tsNs": true,
                  "id": true,
                  "labels": true,
                  "labelTypes": true,
                  "namespace": true,
                  "pod": true,
                  "container": true,
                  "job": true,
                  "instance": true,
                  "service_name": true,
                  "stream": true,
                  "filename": true,
                  "app": true,
                  "component": true,
                  "detected_level": true
                },
                "indexByName": {
                  "Time": 0,
                  "node_name": 1,
                  "process": 2,
                  "event": 3,
                  "pid": 4,
                  "ppid": 5,
                  "ret": 6,
                  "args": 7
                },
                "renameByName": {
                  "node_name": "Node",
                  "process": "Process",
                  "event": "Event",
                  "pid": "PID",
                  "ppid": "PPID",
                  "ret": "Ret",
                  "args": "Args"
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "{namespace=\"tracee\", node_name=~\"$node\"} | json event=\"eventName\", process=\"processName\", pid=\"processId\", ppid=\"parentProcessId\", ret=\"returnValue\", args=\"args\" | event=~\"net_tcp_connect|net_packet_icmp|net_packet_http_request|net_packet_http_response\" | event=~\"$event\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
